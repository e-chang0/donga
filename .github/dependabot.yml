version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/study-progress
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      npm-patches:
        patterns: ['*']
        update-types: [patch]
      npm-minors:
        patterns: ['*']
        update-types: [minor]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: docker
    directory: /packages/study-progress
    schedule:
      interval: weekly
      day: monday
      time: '09:10'
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']

name: Dependabot Auto Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Queue only npm patch updates behind required checks
        if: steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' && steps.metadata.outputs.update-type == 'version-update:semver-patch' && steps.metadata.outputs.directory == '/packages/study-progress'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = (await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number })).data;
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            if (!repository.allow_auto_merge) throw new Error('Enable repository auto-merge first.');
            if (pull.user.login !== 'dependabot[bot]' || pull.head.repo.full_name !== `${owner}/${repo}` || pull.base.ref !== 'main') throw new Error('Unexpected PR origin.');
            const branch = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data;
            const status = branch.protection?.required_status_checks;
            const required = ['collaboration-checks', 'npm-tests', 'security-audit', 'docker-smoke'];
            const actual = new Set([...(status?.contexts || []), ...(status?.checks || []).map(check => check.context)]);
            if (!branch.protected || status?.enforcement_level !== 'everyone' || required.some(name => !actual.has(name))) {
              throw new Error('Branch protection for everyone and all four required checks must be configured first.');
            }
            await github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }`, { id: pull.node_id });
            core.summary.addHeading('Dependabot auto-merge queued').addRaw('Only npm patch updates qualify. GitHub waits for required checks and existing review/conversation rules.');
            await core.summary.write();

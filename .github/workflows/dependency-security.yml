name: Scheduled Dependency Security

on:
  schedule:
    - cron: '23 0 * * 1' # Monday 09:23 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: scheduled-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: packages/study-progress
      - run: node scripts/security-audit.mjs reports/security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduled-npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 90

# GitHub Actions로 서비스 헬스 체크 및 알림
name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

env:
  SERVICE_URL: https://myapp.com/health

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Service
        run: |
          set -euo pipefail

          echo "Checking $SERVICE_URL"
          if curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 15 "$SERVICE_URL"; then
            echo "Service is healthy"
          else
            echo "Service is down or unreachable"
            exit 1
          fi
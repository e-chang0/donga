name: Publish Packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@e-chang0'
          package-manager-cache: false
      - name: Verify tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./packages/study-progress/package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/study-progress" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
        working-directory: packages/study-progress
      - run: npm test
        working-directory: packages/study-progress
      - run: node scripts/security-audit.mjs reports/security
      - name: Build and validate image before publishing
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$VERSION" --tag "$IMAGE:$VERSION" packages/study-progress
          node scripts/verify-container.mjs "$IMAGE:$VERSION"
      - name: Publish npm package to GitHub Packages
        working-directory: packages/study-progress
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify installation from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONSUMER=$(mktemp -d)
          npm install --prefix "$CONSUMER" --ignore-scripts "@e-chang0/study-progress@$VERSION"
          cd "$CONSUMER"
          node --input-type=module -e "import { isNewerVersion } from '@e-chang0/study-progress'; if (!isNewerVersion('1.0.1','1.0.0')) process.exit(1)"
      - name: Log in and push Docker image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
      - name: Pull and validate published Docker image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker image rm "$IMAGE:latest" "$IMAGE:$VERSION"
          docker pull "$IMAGE:$VERSION"
          node scripts/verify-container.mjs "$IMAGE:$VERSION" | tee reports/security/container-verification.txt
          docker logout ghcr.io
          {
            echo "## Published version $VERSION"
            echo "- npm: @e-chang0/study-progress@$VERSION"
            echo "- Docker: $IMAGE:$VERSION"
            echo "- Registry installation, image pull, health, progress, and invalid-input checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 90
